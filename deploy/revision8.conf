# Drop-in for an existing 8c-chat.service using /usr/local/bin/8c-chat.
[Unit]
Description=8c public chat - remembered visitors and local Aye workers

[Service]
EnvironmentFile=/etc/8c-chat.env
Environment=JOURNAL_PATH=/var/lib/8c-chat/chat-v1.jsonl
Environment=LEGACY_PATH=/var/lib/8c-chat/rooms.m8
Environment=AGENTS_CONFIG=/etc/8c-agents.json
UMask=0077
